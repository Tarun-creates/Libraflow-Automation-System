
<div id="adminLoginModal" class="modal hidden">
  <div class="modal-content">
    <div class="modal-header">
      <h3>🔐 Admin Login</h3>
      <button class="modal-close" onclick="closeModal('adminLoginModal')">×</button>
    </div>
    <form onsubmit="adminLogin(event)">
      <div class="form-group">
        <label>Username</label>
        <input id="adminUsername" name="username" class="form-input" type="text" required placeholder="Enter username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input id="adminPassword" name="password" class="form-input" type="password" required placeholder="Enter password">
      </div>
      <button type="submit" class="btn btn-primary">Login</button>
    </form>
    <div style="margin-top: 1rem; padding: 0.75rem; background: var(--card-bg); border-radius: 0.5rem; font-size: 0.85rem;">
      <strong>Default Credentials:</strong><br>
      Username: <code>admin</code><br>
      Password: <code>admin123</code>
    </div>
  </div>
</div>


<div class="modal" id="addBookModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Add Book</h3>
      <button class="modal-close" onclick="closeModal('addBookModal')">×</button>
    </div>
    <form id="bookForm" onsubmit="addBook(event)">
      <div class="form-group"><label>Title</label><input id="bookTitle" class="form-input" required></div>
      <div class="form-group"><label>Author</label><input id="bookAuthor" class="form-input" required></div>
      <div class="form-group"><label>Category</label><input id="bookCategory" class="form-input"></div>
      <button class="btn btn-primary">Add</button>
    </form>
  </div>
</div>


<div class="modal" id="editBookModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Edit Book</h3>
      <button class="modal-close" onclick="closeModal('editBookModal')">×</button>
    </div>
    <form onsubmit="updateBook(event)">
      <input type="hidden" id="editBookId">
      <div class="form-group"><label>Title</label><input class="form-input" id="editBookTitle" required></div>
      <div class="form-group"><label>Author</label><input class="form-input" id="editBookAuthor" required></div>
      <div class="form-group"><label>Category</label><input class="form-input" id="editBookCategory"></div>
      <div class="form-group">
        <label>Status</label>
        <select class="form-input" id="editBookStatus">
          <option value="available">Available</option>
          <option value="borrowed">Borrowed</option>
        </select>
      </div>
      <button class="btn btn-primary">Save</button>
    </form>
  </div>
</div>

<div class="modal" id="deleteBookModal">
  <div class="modal-content">
    <h3>Delete Book?</h3>
    <input type="hidden" id="deleteBookId">
    <div style="margin-top: 1rem;">
      <button class="btn btn-primary" onclick="confirmDeleteBook()">Yes</button>
      <button class="btn btn-secondary" onclick="closeModal('deleteBookModal')">Cancel</button>
    </div>
  </div>
</div>


<div class="modal" id="addMemberModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Add Member</h3>
      <button class="modal-close" onclick="closeModal('addMemberModal')">×</button>
    </div>
    <form id="memberForm" onsubmit="addMember(event)">
      <div class="form-group"><label>Name</label><input id="memberName" class="form-input" required></div>
      <div class="form-group"><label>Email</label><input id="memberEmail" class="form-input" required></div>
      <div class="form-group"><label>Phone</label><input id="memberPhone" class="form-input" maxlength="15" required></div>
      <button class="btn btn-primary">Add</button>
    </form>
  </div>
</div>

<div class="modal" id="issueBookModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Issue Book</h3>
      <button class="modal-close" onclick="closeModal('issueBookModal')">×</button>
    </div>
    <form id="issueForm" onsubmit="issueBook(event)">
      <div class="form-group">
        <label>Select Member</label>
        <select id="issueMemberSelect" class="form-input" required>
          <option value="">Loading members...</option>
        </select>
      </div>
      <div class="form-group">
        <label>Select Book (AI Recommended)</label>
        <select id="issueBookSelect" class="form-input" required>
          <option value="">Select member first...</option>
        </select>
      </div>
      <div class="form-group">
        <label>Due Date (optional)</label>
        <input id="issueDueDate" class="form-input" type="date" placeholder="YYYY-MM-DD">
      </div>
      <button class="btn btn-primary">Issue Book</button>
    </form>
  </div>
</div>

<div class="modal" id="returnBookModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Return Book</h3>
      <button class="modal-close" onclick="closeModal('returnBookModal')">×</button>
    </div>
    <form id="returnForm" onsubmit="returnBook(event)">
      <div class="form-group">
        <label>Select Borrowed Book</label>
        <select id="returnBookSelect" class="form-input" required>
          <option value="">Loading borrowed books...</option>
        </select>
      </div>
      <div class="form-group">
        <label>Return Date (optional)</label>
        <input type="date" id="returnReturnDate" class="form-input">
      </div>
      <button class="btn btn-primary">Return Book</button>
    </form>
  </div>
</div>

<div class="modal" id="bookDetailsModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Book Details</h3>
      <button class="modal-close" onclick="closeModal('bookDetailsModal')">×</button>
    </div>
    <div id="bookDetailsBody"><div class="loader"></div></div>
  </div>
</div>

<div class="modal" id="memberProfileModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Member Profile</h3>
      <button class="modal-close" onclick="closeModal('memberProfileModal')">×</button>
    </div>
    <div id="memberProfileBody"><div class="loader"></div></div>
  </div>
</div>


<div class="modal" id="issueHistoryModal">
  <div class="modal-content" style="width:900px; max-width:95vw;">
    <div class="modal-header">
      <h3>Issue History</h3>
      <button class="modal-close" onclick="closeModal('issueHistoryModal')">×</button>
    </div>
    <div style="margin-bottom:1rem; display:flex; gap:0.5rem;">
      <input id="historyMemberFilter" class="form-input" placeholder="Member ID" />
      <input id="historyBookFilter" class="form-input" placeholder="Book ID" />
      <label style="color:var(--text-secondary)">
        <input type="checkbox" id="historyUnreturnedOnly" /> Only unreturned
      </label>
      <button class="btn btn-primary" onclick="loadIssueHistory()">Filter</button>
      <button class="btn btn-secondary" onclick="exportIssueHistory()">Export CSV</button>
    </div>
    <div id="issueHistoryBody"><div class="loader"></div></div>
  </div>
</div>
